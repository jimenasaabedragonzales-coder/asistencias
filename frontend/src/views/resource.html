<section class="space-y-6">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold uppercase tracking-wide text-cyan-700">Administración</p>
        <h3 id="ResourceTitle" class="mt-1 text-2xl font-bold text-slate-950"></h3>
        <p id="ResourceDescription" class="mt-2 text-sm text-slate-600"></p>
        <div id="ResourceMessage" class="mt-4 hidden rounded-md px-4 py-3 text-sm font-semibold" role="status"></div>
        <form id="ResourceForm" class="mt-5 grid gap-4 md:grid-cols-3"></form>
    </div>
    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead id="ResourceHead" class="bg-slate-50 text-left text-xs font-bold uppercase tracking-wide text-slate-500"></thead>
                <tbody id="ResourceRows" class="divide-y divide-slate-100 bg-white"></tbody>
            </table>
        </div>
    </div>
</section>
