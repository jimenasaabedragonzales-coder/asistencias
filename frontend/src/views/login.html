<main class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
    <section class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-7 shadow-sm">
        <div class="mb-6 flex items-center gap-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-cyan-100 text-cyan-800">
                <span data-icon="clipboardCheck" data-icon-class="h-7 w-7"></span>
            </div>
            <div>
                <p class="text-sm font-semibold uppercase tracking-wide text-cyan-700">Sistema escolar</p>
                <h1 class="text-xl font-bold text-slate-950">Control de Asistencias</h1>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-slate-950">Iniciar sesión</h2>
        <p class="mt-2 text-sm text-slate-600">Ingresa con tu cuenta de administrador o docente.</p>
        <div id="LoginMessage" class="mt-4 hidden rounded-md px-4 py-3 text-sm font-semibold" role="alert"></div>
        <form id="LoginForm" class="mt-5 grid gap-4">
            <label class="text-sm font-semibold text-slate-700" for="LoginUsername">Usuario
                <input id="LoginUsername" name="username" type="text" autocomplete="username" required maxlength="50"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-cyan-600 focus:outline-none">
            </label>
            <label class="text-sm font-semibold text-slate-700" for="LoginPassword">Contraseña
                <input id="LoginPassword" name="password" type="password" autocomplete="current-password" required
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-cyan-600 focus:outline-none">
            </label>
            <button id="LoginSubmit" type="submit" class="rounded-md bg-cyan-700 px-4 py-3 text-sm font-bold text-white hover:bg-cyan-800">
                Entrar
            </button>
        </form>
    </section>
</main>
